<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>502 - Bad Gateway | Nginx</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-white flex items-center justify-center px-6">

    <main class="text-center max-w-xl">

        <!-- Nginx -->
        <div class="flex items-center justify-center gap-2 mb-8">
            <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>

            <span class="text-sm font-medium text-gray-500">
                Nginx
            </span>
        </div>

        <!-- Error Code -->
        <h1 class="text-8xl sm:text-9xl font-bold tracking-tight text-gray-900">
            502
        </h1>

        <!-- Heading -->
        <h2 class="mt-4 text-2xl sm:text-3xl font-semibold text-gray-900">
            Bad Gateway
        </h2>

        <!-- Description -->
        <p class="mt-4 text-gray-500 leading-relaxed">
            Nginx received an invalid response from the upstream server.
            The server may be temporarily unavailable.
        </p>

        <!-- Status -->
        <div class="mt-6 inline-flex items-center gap-2
                    px-3 py-1.5 rounded-full
                    bg-gray-50 border border-gray-200">

            <span class="w-2 h-2 rounded-full bg-red-500"></span>

            <span class="text-sm text-gray-500">
                Server error
            </span>
        </div>

        <!-- Button -->
        <div class="mt-8">
            <button
                onclick="window.location.reload()"
                class="px-5 py-2.5 rounded-lg
                       bg-gray-900 text-white
                       text-sm font-medium
                       hover:bg-gray-800
                       transition"
            >
                Try Again
            </button>
        </div>

        <!-- Footer -->
        <p class="mt-12 text-xs text-gray-400">
            Nginx · HTTP 502
        </p>

    </main>

</body>
</html>
